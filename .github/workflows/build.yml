name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 서명 키 풀기
        env:
          ZAKO_KEYSTORE_B64: ${{ secrets.ZAKO_KEYSTORE_B64 }}
        run: |
          if [ -n "$ZAKO_KEYSTORE_B64" ]; then
            echo "$ZAKO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zako.p12"
            echo "ZAKO_KEYSTORE=$RUNNER_TEMP/zako.p12" >> "$GITHUB_ENV"
          fi

      - name: 시험 + 빌드
        env:
          ZAKO_KEYSTORE_PASSWORD: ${{ secrets.ZAKO_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon test assembleDebug assembleRelease

      - name: 릴리스 APK 서명 확인
        run: |
          cp app/build/outputs/apk/release/app-release.apk ZakoCode.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs ZakoCode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ZakoCode.apk
            app/build/outputs/apk/debug/app-debug.apk

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터 + 진짜 Termux 로 끝까지
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash e2e/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
          if-no-files-found: warn

  release:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ZakoCode.apk
          --repo "$GITHUB_REPOSITORY"
          --title "Zako Code $GITHUB_REF_NAME"
          --notes "갤럭시(안드로이드)용 APK 입니다. 설치와 Termux 설정은 README 를 보세요."
